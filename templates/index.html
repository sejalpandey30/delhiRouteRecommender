<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delhi Transit — Multimodal Route Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f;
    --paper:#eef1ec;
    --panel:#ffffff;
    --line:#d7dbd3;
    --muted:#5b6560;
    --bus:#c8443c;
    --walk:#9aa0a6;
    --focus:#0072bc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}

  .wrap{max-width:880px; margin:0 auto; padding:32px 20px 80px;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px; margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    margin:6px 0 0;
    letter-spacing:-0.01em;
  }
  .badge-strip{display:flex; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .badge-strip span{
    border:1px solid var(--ink); padding:3px 8px; border-radius:20px;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
  }

  .field-row{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end;}
  @media (max-width:640px){ .field-row{grid-template-columns:1fr;} }
  .swap-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--ink);
    background:var(--panel); cursor:pointer; font-size:16px; align-self:center;
    display:flex; align-items:center; justify-content:center;
  }
  .swap-btn:hover{background:var(--ink); color:var(--panel);}

  .field{position:relative;}
  label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  input[type=text], input[type=time]{
    width:100%; padding:12px 14px; font-size:15px; font-family:'IBM Plex Sans',sans-serif;
    border:1.5px solid var(--ink); border-radius:8px; background:#fff; color:var(--ink);
  }
  input:focus{outline:2px solid var(--focus); outline-offset:1px;}

  .dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:#fff; border:1.5px solid var(--ink); border-radius:8px;
    max-height:260px; overflow-y:auto; z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    display:none;
  }
  .dropdown.open{display:block;}
  .dd-item{
    padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid #eee; font-size:14px;
  }
  .dd-item:last-child{border-bottom:none;}
  .dd-item:hover, .dd-item.active{background:var(--paper);}
  .mode-chip{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase;
    padding:2px 6px; border-radius:4px; color:#fff; letter-spacing:.05em;
  }
  .mode-chip.bus{background:var(--bus);}
  .mode-chip.metro{background:var(--focus);}

  .bottom-row{display:flex; gap:14px; align-items:end; margin-top:16px; flex-wrap:wrap;}
  .time-field{width:150px;}
  button.go{
    background:var(--ink); color:#fff; border:none; border-radius:8px;
    padding:13px 26px; font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:15px; cursor:pointer;
  }
  button.go:hover{background:#000;}
  button.go:disabled{opacity:.5; cursor:default;}

  #status{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted); margin:6px 0 20px;}
  #status.error{color:var(--bus);}

  .summary{
    display:flex; gap:28px; flex-wrap:wrap; margin-bottom:22px;
    font-family:'IBM Plex Mono',monospace;
  }
  .summary .stat .num{font-size:26px; font-weight:600; font-family:'Space Grotesk',sans-serif;}
  .summary .stat .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}

  /* --- journey line diagram, the signature element --- */
  .diagram{position:relative; padding-left:34px;}
  .leg{position:relative; padding-bottom:26px;}
  .leg:last-child{padding-bottom:0;}
  .rail{
    position:absolute; left:-24px; top:6px; bottom:-6px; width:5px;
    border-radius:3px;
  }
  .leg.walk .rail{
    background:repeating-linear-gradient(to bottom, var(--walk) 0 4px, transparent 4px 9px);
  }
  .node{
    position:absolute; left:-30px; top:0; width:17px; height:17px; border-radius:50%;
    background:#fff; border:3px solid var(--ink); z-index:2;
  }
  .leg-body{padding-top:0px;}
  .leg-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .route-chip{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px;
    color:#fff; padding:3px 9px; border-radius:5px; white-space:nowrap;
  }
  .leg-mode-label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .stop-line{font-size:14.5px; line-height:1.55;}
  .stop-line b{font-weight:600;}
  .time-tag{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted);
  }
  .walk-text{font-size:13.5px; color:var(--muted); font-style:normal;}

  .empty-hint{
    color:var(--muted); font-size:14px; padding:30px 6px; text-align:center;
  }

  footer{
    margin-top:36px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--muted); text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">Delhi · Bus + Metro · Multimodal</div>
      <h1>One route,<br>every mode.</h1>
    </div>
    <div class="badge-strip">
      <span>10,559 bus stops</span>
      <span>263 metro stns</span>
    </div>
  </header>

  <div class="panel">
    <div class="field-row">
      <div class="field">
        <label for="origin">From</label>
        <input type="text" id="origin" placeholder="Search a stop or station…" autocomplete="off">
        <div class="dropdown" id="origin-dd"></div>
      </div>
      <button class="swap-btn" id="swap" title="Swap origin and destination">⇄</button>
      <div class="field">
        <label for="dest">To</label>
        <input type="text" id="dest" placeholder="Search a stop or station…" autocomplete="off">
        <div class="dropdown" id="dest-dd"></div>
      </div>
    </div>
    <div class="bottom-row">
      <div class="field time-field">
        <label for="time">Depart at</label>
        <input type="time" id="time" value="09:00">
      </div>
      <button class="go" id="go">Find route</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <footer>Built on the DTC/DIMTS + DMRC GTFS feeds · Journeys computed with RAPTOR</footer>
</div>

<script>
let originStop = null, destStop = null;

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function search(query){
  if(!query || query.length < 2) return [];
  const res = await fetch('/api/search?q=' + encodeURIComponent(query));
  return res.ok ? res.json() : [];
}

function wireAutocomplete(inputId, ddId, onPick){
  const input = document.getElementById(inputId);
  const dd = document.getElementById(ddId);

  const run = debounce(async () => {
    const items = await search(input.value);
    if(items.length === 0){ dd.classList.remove('open'); return; }
    dd.innerHTML = items.map(it => `
      <div class="dd-item" data-idx="${it.stop_idx}" data-name="${it.name.replace(/"/g,'&quot;')}">
        <span class="mode-chip ${it.mode}">${it.mode}</span>
        <span>${it.name}</span>
      </div>
    `).join('');
    dd.classList.add('open');
    dd.querySelectorAll('.dd-item').forEach(el => {
      el.addEventListener('click', () => {
        input.value = el.dataset.name;
        onPick({stop_idx: parseInt(el.dataset.idx), name: el.dataset.name});
        dd.classList.remove('open');
      });
    });
  }, 200);

  input.addEventListener('input', () => { onPick(null); run(); });
  input.addEventListener('focus', run);
  document.addEventListener('click', (e) => {
    if(!dd.contains(e.target) && e.target !== input) dd.classList.remove('open');
  });
}

wireAutocomplete('origin', 'origin-dd', (stop) => { originStop = stop; });
wireAutocomplete('dest', 'dest-dd', (stop) => { destStop = stop; });

document.getElementById('swap').addEventListener('click', () => {
  const oInput = document.getElementById('origin'), dInput = document.getElementById('dest');
  const tmpVal = oInput.value; oInput.value = dInput.value; dInput.value = tmpVal;
  const tmpStop = originStop; originStop = destStop; destStop = tmpStop;
});

function statusMsg(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

function fmtWalk(min){ return min + ' min walk'; }

function renderResults(data){
  const results = document.getElementById('results');
  if(!data){ results.innerHTML=''; return; }

  const legsHtml = data.legs.map(leg => {
    if(leg.type === 'transit'){
      return `
        <div class="leg transit">
          <div class="rail" style="background:${leg.color}"></div>
          <div class="node" style="border-color:${leg.color}"></div>
          <div class="leg-body">
            <div class="leg-head">
              <span class="route-chip" style="background:${leg.color}">${leg.route}</span>
              <span class="leg-mode-label">${leg.mode} · ${leg.line_name}</span>
            </div>
            <div class="stop-line"><b>${leg.board_stop}</b> <span class="time-tag">${leg.board_time}</span></div>
            <div class="stop-line">↓</div>
            <div class="stop-line"><b>${leg.alight_stop}</b> <span class="time-tag">${leg.alight_time}</span></div>
          </div>
        </div>`;
    } else {
      return `
        <div class="leg walk">
          <div class="rail"></div>
          <div class="node" style="border-color:var(--walk)"></div>
          <div class="leg-body">
            <div class="leg-head"><span class="leg-mode-label">Walk</span></div>
            <div class="walk-text">${leg.from_stop} → ${leg.to_stop} · ${fmtWalk(leg.walk_minutes)}</div>
          </div>
        </div>`;
    }
  }).join('');

  results.innerHTML = `
    <div class="summary">
      <div class="stat"><div class="num">${data.duration_minutes}m</div><div class="lbl">Total time</div></div>
      <div class="stat"><div class="num">${data.transfers}</div><div class="lbl">Transfers</div></div>
      <div class="stat"><div class="num">${data.departure_time}</div><div class="lbl">Depart</div></div>
      <div class="stat"><div class="num">${data.arrival_time}</div><div class="lbl">Arrive</div></div>
    </div>
    <div class="panel">
      <div class="diagram">${legsHtml}</div>
    </div>
  `;
}

document.getElementById('go').addEventListener('click', async () => {
  if(!originStop){ statusMsg('Pick an origin stop from the dropdown.', true); return; }
  if(!destStop){ statusMsg('Pick a destination stop from the dropdown.', true); return; }
  const time = document.getElementById('time').value || '09:00';

  statusMsg('Searching…', false);
  renderResults(null);

  const params = new URLSearchParams({origin: originStop.stop_idx, dest: destStop.stop_idx, time});
  const res = await fetch('/api/plan?' + params.toString());
  const data = await res.json();

  if(!res.ok){
    statusMsg(data.error || 'No route found.', true);
    return;
  }
  statusMsg(`${data.origin} → ${data.destination}`, false);
  renderResults(data);
});
</script>
</body>
</html>
