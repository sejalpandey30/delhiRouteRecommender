<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delhi Transit — Multimodal Route Planner</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Leaflet CSS (served locally + CDN fallback) -->
<link rel="stylesheet" href="/static/leaflet/leaflet.css"/>

<style>
/* ── Reset & Variables ─────────────────────────────────────────────────── */
:root {
  --bg-main: #0f172a;
  --bg-sidebar: #ffffff;
  --bg-card: #f8fafc;
  --border: #e2e8f0;
  --border-focus: #3b82f6;
  --text-primary: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --metro: #0284c7;
  --bus: #dc2626;
  --walk: #64748b;
  --dest: #16a34a;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-primary);
  background: #f1f5f9;
}

/* ── Main App Layout ───────────────────────────────────────────────────── */
.app-container {
  display: flex;
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ── Left Sidebar ──────────────────────────────────────────────────────── */
.sidebar {
  width: 440px;
  min-width: 360px;
  max-width: 480px;
  height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 20;
  box-shadow: var(--shadow-lg);
}

.sidebar-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: #ffffff;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #2563eb, #0284c7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 18px;
  box-shadow: 0 4px 10px rgba(37,99,235,0.3);
}

.brand-title h1 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.network-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  background: #eff6ff;
  color: #2563eb;
  padding: 4px 8px;
  border-radius: 20px;
  border: 1px solid #bfdbfe;
}

.network-stats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.stat-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-secondary);
  background: #f8fafc;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

/* ── Sidebar Scrollable Body ───────────────────────────────────────────── */
.sidebar-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 18px 24px;
  scrollbar-width: thin;
}

/* ── Search Box ──────────────────────────────────────────────────────────[...]
.search-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.input-group {
  position: relative;
  margin-bottom: 10px;
}

.input-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.input-label .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.dot.origin-dot { background: var(--accent); }
.dot.dest-dot { background: var(--dest); }

.search-input {
  width: 100%;
  padding: 11px 13px;
  font-size: 14px;
  font-family: inherit;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background: #ffffff;
  color: var(--text-primary);
  transition: all 0.2s ease;
}

.search-input:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}

.swap-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0 6px;
  position: relative;
}

.swap-divider::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--border);
}

.swap-button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: #ffffff;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  transition: all 0.2s ease;
  font-size: 14px;
}

.swap-button:hover {
  background: var(--text-primary);
  color: #ffffff;
  border-color: var(--text-primary);
  transform: rotate(180deg);
}

.time-go-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  margin-top: 12px;
}

.time-wrapper {
  width: 130px;
}

.btn-plan {
  flex: 1;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(37,99,235,0.25);
}

.btn-plan:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

.btn-plan:active {
  transform: translateY(0);
}

/* ── Autocomplete Dropdown ─────────────────────────────────────────────── */
.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: #ffffff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  max-height: 250px;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: var(--shadow-lg);
  display: none;
}

.dropdown-menu.active { display: block; }

.dropdown-item {
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13.5px;
  transition: background 0.15s ease;
}

.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: #f8fafc; }

.mode-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  padding: 3px 6px;
  border-radius: 4px;
  color: #ffffff;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.mode-badge.metro { background: var(--metro); }
.mode-badge.bus { background: var(--bus); }

/* ── Status Message ────────────────────────────────────────────────────── */
.status-msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
  display: none;
}

.status-msg.active { display: block; }
.status-msg.info { background: #f8fafc; color: var(--text-secondary); border: 1px solid var(--border); }
.status-msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.status-msg.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }

/* ── Plan Summary & Journey Diagram ────────────────────────────────────── */
.result-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.summary-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.metric-box {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 6px;
  text-align: center;
}

.metric-val {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.1;
  margin-bottom: 3px;
}

.metric-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
}

.route-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.btn-save-fav {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #ffffff;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-save-fav:hover {
  background: #fefce8;
  color: #a16207;
  border-color: #fde047;
}

.btn-download-route {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #ffffff;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-download-route:hover {
  background: #dbeafe;
  color: #1e40af;
  border-color: #3b82f6;
}

.journey-timeline {
  position: relative;
  padding-left: 28px;
  margin-top: 10px;
}

.leg-item {
  position: relative;
  padding-bottom: 20px;
}

.leg-item:last-child { padding-bottom: 0; }

.leg-track {
  position: absolute;
  left: -20px;
  top: 8px;
  bottom: -4px;
  width: 4px;
  border-radius: 2px;
}

.leg-item.walk .leg-track {
  background: repeating-linear-gradient(
    to bottom,
    var(--walk) 0,
    var(--walk) 4px,
    transparent 4px,
    transparent 8px
  );
}

.leg-node {
  position: absolute;
  left: -25px;
  top: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  border: 3px solid var(--text-primary);
  z-index: 2;
}

.leg-content {
  font-size: 13.5px;
}

.leg-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.route-badge {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 11px;
  color: white;
  padding: 2px 7px;
  border-radius: 5px;
}

.leg-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
}

.stop-row {
  line-height: 1.5;
  color: var(--text-primary);
}

.stop-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: 4px;
}

/* ── Tabs (History / Favourites) ───────────────────────────────────────── */
.tab-container {
  margin-top: 6px;
}

.tab-headers {
  display: flex;
  border-bottom: 1.5px solid var(--border);
  margin-bottom: 12px;
}

.tab-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  padding: 8px 16px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: -1.5px;
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-pane { display: none; }
.tab-pane.active { display: block; }

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.pane-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.btn-clear {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
}
.btn-clear:hover { color: #dc2626; background: #fee2e2; }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.list-row:hover {
  border-color: var(--border-focus);
  background: #f8fafc;
}

.list-row-info {
  flex: 1;
  min-width: 0;
}

.list-row-route {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.list-row-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-secondary);
}

.btn-delete-row {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 4px;
}
.btn-delete-row:hover { color: #dc2626; background: #fee2e2; }

.empty-state {
  text-align: center;
  padding: 24px 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* ── Right Map Area ────────────────────────────────────────────────────── */
.map-container {
  flex: 1;
  height: 100vh;
  position: relative;
  background: #e2e8f0;
}

#map {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1;
}

/* Map Header Overlay */
.map-overlay-header {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 16px;
}

.overlay-legend {
  display: flex;
  align-items: center;
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

.legend-color {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* Floating Recenter button */
.btn-recenter {
  position: absolute;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  background: #ffffff;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-recenter:hover {
  background: var(--text-primary);
  color: #ffffff;
}

/* ── Leaflet Custom Styling ────────────────────────────────────────────── */
.custom-pin {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: white;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 800;
  font-size: 11px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  border: 2.5px solid white;
}

/* ── Responsive ──────────────────────────────────────────────────────────[...]
@media (max-width: 900px) {
  .app-container {
    flex-direction: column;
    height: auto;
    overflow: auto;
  }
  .sidebar {
    width: 100%;
    max-width: 100%;
    height: auto;
    box-shadow: none;
  }
  .map-container {
    height: 480px;
    flex: none;
  }
}
</style>
</head>
<body>

<div class="app-container">

  <!-- ═════════════════════════ SIDEBAR ═════════════════════════ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-title">
          <div class="brand-icon">D</div>
          <h1>Delhi Transit</h1>
        </div>
        <span class="network-badge">RAPTOR v2</span>
      </div>
      <div class="network-stats">
        <span class="stat-pill">🚇 263 Metro Stations</span>
        <span class="stat-pill">🚌 10,559 Bus Stops</span>
      </div>
    </div>

    <div class="sidebar-content">

      <!-- Plan Form Card -->
      <div class="search-card">
        <div class="input-group">
          <label class="input-label" for="origin">
            <span class="dot origin-dot"></span> Origin
          </label>
          <input type="text" id="origin" class="search-input" placeholder="Search metro station or bus stop…" autocomplete="off">
          <div class="dropdown-menu" id="origin-dd"></div>
        </div>

        <div class="swap-divider">
          <button class="swap-button" id="btn-swap" title="Swap Origin & Destination">⇄</button>
        </div>

        <div class="input-group">
          <label class="input-label" for="dest">
            <span class="dot dest-dot"></span> Destination
          </label>
          <input type="text" id="dest" class="search-input" placeholder="Search metro station or bus stop…" autocomplete="off">
          <div class="dropdown-menu" id="dest-dd"></div>
        </div>

        <div class="time-go-row">
          <div class="time-wrapper">
            <label class="input-label" for="time">Departure</label>
            <input type="time" id="time" class="search-input" value="09:00">
          </div>
          <button class="btn-plan" id="btn-plan">
            <span>Find Best Route</span> →
          </button>
        </div>
      </div>

      <!-- Status alerts -->
      <div class="status-msg" id="status-msg"></div>

      <!-- Result View -->
      <div id="results-view"></div>

      <!-- History & Favourites Tabs -->
      <div class="tab-container">
        <div class="tab-headers">
          <button class="tab-btn active" data-tab="history">Recent Searches</button>
          <button class="tab-btn" data-tab="favs">⭐ Saved Routes</button>
        </div>

        <!-- History Pane -->
        <div class="tab-pane active" id="pane-history">
          <div class="pane-header">
            <span class="pane-title">Search History</span>
            <button class="btn-clear" id="btn-clear-history">Clear History</button>
          </div>
          <div class="item-list" id="history-list">
            <div class="empty-state">No search history yet.</div>
          </div>
        </div>

        <!-- Favourites Pane -->
        <div class="tab-pane" id="pane-favs">
          <div class="pane-header">
            <span class="pane-title">Favourite Journeys</span>
          </div>
          <div class="item-list" id="fav-list">
            <div class="empty-state">No favourite routes saved yet.</div>
          </div>
        </div>
      </div>

    </div>
  </aside>

  <!-- ═════════════════════════ MAP VIEW ═════════════════════════ -->
  <main class="map-container">
    <div class="map-overlay-header">
      <div class="overlay-legend">
        <div class="legend-item"><div class="legend-color" style="background:#0284c7;"></div> Metro</div>
        <div class="legend-item"><div class="legend-color" style="background:#dc2626;"></div> Bus</div>
        <div class="legend-item"><div class="legend-color" style="background:#64748b;"></div> Walk</div>
        <div class="legend-item"><div class="legend-color" style="background:#16a34a;"></div> Destination</div>
      </div>
    </div>

    <div id="map"></div>

    <button class="btn-recenter" id="btn-recenter" title="Recenter on Delhi">
      <span>📍 Recenter Map</span>
    </button>
  </main>

</div>

<!-- Leaflet Library with automatic CDN fallback -->
<script src="/static/leaflet/leaflet.js"></script>
<script>
  if (typeof L === 'undefined') {
    document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
    document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>');
  }
</script>

<script>
/* ════════════════════════════════════════════════════════════════[...]
   1. MAP INITIALIZATION & TILE PROVIDERS
   ════════════════════════════════════════════════════════════════[...]
const DELHI_CENTER = [28.6139, 77.2090];
const map = L.map('map', {
  center: DELHI_CENTER,
  zoom: 12,
  zoomControl: true
});

// Primary: OpenStreetMap with CARTO subdomains fallback
const primaryTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Fallback to CartoDB if OSM fails to load
primaryTiles.on('tileerror', function() {
  console.warn('Primary OSM tile server issue; fallback active.');
});

// Ensure map container renders accurately on initial paint and resize
function refreshMapSize() {
  setTimeout(() => { map.invalidateSize(); }, 200);
}
window.addEventListener('resize', refreshMapSize);
window.addEventListener('load', refreshMapSize);
document.getElementById('btn-recenter').addEventListener('click', () => {
  map.setView(DELHI_CENTER, 12);
});

let activeRouteLayers = [];

function clearRouteLayers() {
  activeRouteLayers.forEach(layer => map.removeLayer(layer));
  activeRouteLayers = [];
}

function createMarkerPin(color, label, size = 28) {
  return L.divIcon({
    className: '',
    html: `<div class="custom-pin" style="background:${color};width:${size}px;height:${size}px;">${label}</div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2]
  });
}

function renderRouteOnMap(planData) {
  clearRouteLayers();
  const stops = planData.stop_coords || [];
  if (!stops.length) return;

  const latLngs = stops.map(s => [s.lat, s.lon]);

  // Route Polyline with subtle glow
  const polylineGlow = L.polyline(latLngs, {
    color: '#3b82f6',
    weight: 8,
    opacity: 0.35,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);
  activeRouteLayers.push(polylineGlow);

  const polyline = L.polyline(latLngs, {
    color: '#1d4ed8',
    weight: 4.5,
    opacity: 0.95,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);
  activeRouteLayers.push(polyline);

  // Markers for each stop
  stops.forEach((s, idx) => {
    const isStart = idx === 0;
    const isEnd = idx === stops.length - 1;
    let pinColor = s.mode === 'metro' ? '#0284c7' : '#dc2626';
    let pinLabel = '';

    if (isStart) {
      pinColor = '#2563eb';
      pinLabel = 'A';
    } else if (isEnd) {
      pinColor = '#16a34a';
      pinLabel = 'B';
    }

    const pin = L.marker([s.lat, s.lon], {
      icon: createMarkerPin(pinColor, pinLabel, isStart || isEnd ? 30 : 22)
    }).bindPopup(`
      <div style="font-family:'Plus Jakarta Sans',sans-serif;padding:4px;">
        <div style="font-weight:700;font-size:14px;margin-bottom:2px;">${s.name}</div>
        <div style="font-size:11px;color:#64748b;font-family:'JetBrains Mono',monospace;text-transform:uppercase;">${s.mode}</div>
      </div>
    `).addTo(map);

    activeRouteLayers.push(pin);
  });

  // Fit map bounds to show complete journey with padding
  map.fitBounds(polyline.getBounds(), { padding: [60, 60] });
  refreshMapSize();
}

/* ════════════════════════════════════════════════════════════════[...]
   2. AUTOCOMPLETE & INPUT MANAGEMENT
   ════════════════════════════════════════════════════════════════[...]
let selectedOrigin = null;
let selectedDest = null;
let lastPlanData = null;

function debounce(fn, delay = 200) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

async function queryStops(q) {
  if (!q || q.trim().length < 2) return [];
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q.trim()));
    return res.ok ? await res.json() : [];
  } catch (err) {
    return [];
  }
}

function bindAutocomplete(inputId, dropdownId, onSelect) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);

  const fetchAndShow = debounce(async () => {
    const results = await queryStops(input.value);
    if (!results.length) {
      dropdown.classList.remove('active');
      return;
    }

    dropdown.innerHTML = results.map(item => `
      <div class="dropdown-item" data-idx="${item.stop_idx}" data-name="${item.name.replace(/"/g, '&quot;')}">
        <span>${item.name}</span>
        <span class="mode-badge ${item.mode.toLowerCase()}">${item.mode}</span>
      </div>
    `).join('');
    dropdown.classList.add('active');
  });

  input.addEventListener('input', fetchAndShow);

  dropdown.addEventListener('click', (e) => {
    const item = e.target.closest('.dropdown-item');
    if (item) {
      const idx = parseInt(item.dataset.idx);
      const name = item.dataset.name;
      input.value = name;
      dropdown.classList.remove('active');
      onSelect({ stop_idx: idx, name });
    }
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('active');
    }
  });
}

bindAutocomplete('origin', 'origin-dd', (item) => {
  selectedOrigin = item;
});

bindAutocomplete('dest', 'dest-dd', (item) => {
  selectedDest = item;
});

document.getElementById('btn-swap').addEventListener('click', () => {
  [selectedOrigin, selectedDest] = [selectedDest, selectedOrigin];
  document.getElementById('origin').value = selectedOrigin?.name || '';
  document.getElementById('dest').value = selectedDest?.name || '';
});

/* ════════════════════════════════════════════════════════════════[...]
   3. ROUTE PLANNING & RESULT RENDERING
   ════════════════════════════════════════════════════════════════[...]
async function planRoute() {
  if (!selectedOrigin || !selectedDest) {
    showStatus('Please select both origin and destination', 'error');
    return;
  }

  if (selectedOrigin.stop_idx === selectedDest.stop_idx) {
    showStatus('Origin and destination are the same', 'error');
    return;
  }

  const time = document.getElementById('time').value;
  showStatus('Planning route...', 'info');

  try {
    const res = await fetch(
      `/api/plan?origin=${selectedOrigin.stop_idx}&dest=${selectedDest.stop_idx}&time=${time}`
    );
    if (!res.ok) throw new Error(await res.text());

    const plan = await res.json();
    lastPlanData = plan;
    renderResult(plan);
    renderRouteOnMap(plan);
    showStatus('Route planned successfully', 'success');
  } catch (err) {
    showStatus('No route found for this journey', 'error');
    console.error(err);
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = `status-msg active ${type}`;
}

function renderResult(plan) {
  const html = `
    <div class="result-card">
      <div class="summary-metrics">
        <div class="metric-box">
          <div class="metric-val">${plan.duration_minutes}</div>
          <div class="metric-lbl">Minutes</div>
        </div>
        <div class="metric-box">
          <div class="metric-val">${plan.transfers}</div>
          <div class="metric-lbl">Transfers</div>
        </div>
        <div class="metric-box">
          <div class="metric-val">${plan.departure_time}</div>
          <div class="metric-lbl">Depart</div>
        </div>
        <div class="metric-box">
          <div class="metric-val">${plan.arrival_time}</div>
          <div class="metric-lbl">Arrive</div>
        </div>
      </div>

      <div class="route-actions">
        <button class="btn-save-fav" id="btn-save-fav-result">Save Route</button>
        <button class="btn-download-route" id="btn-download-route">Download Route</button>
      </div>

      <div class="journey-timeline">
        ${plan.legs.map((leg, i) => {
          if (leg.type === 'transit') {
            return `
              <div class="leg-item">
                <div class="leg-track" style="background:${leg.color}"></div>
                <div class="leg-node"></div>
                <div class="leg-content">
                  <div class="leg-header">
                    <span class="route-badge" style="background:${leg.color}">${leg.route}</span>
                    <span class="leg-title">${leg.mode}</span>
                  </div>
                  <div class="stop-row">
                    <strong>${leg.line_name}</strong>
                    <span class="stop-time">${leg.board_time} → ${leg.alight_time}</span>
                  </div>
                  <div class="stop-row">
                    <small>${leg.board_stop}</small>
                  </div>
                  <div class="stop-row">
                    <small>→ ${leg.alight_stop}</small>
                  </div>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="leg-item walk">
                <div class="leg-track"></div>
                <div class="leg-node"></div>
                <div class="leg-content">
                  <div class="leg-header">
                    <span class="leg-title">Walk</span>
                  </div>
                  <div class="stop-row">
                    <small>${leg.from_stop}</small>
                  </div>
                  <div class="stop-row">
                    <small>→ ${leg.to_stop} (${leg.walk_minutes} min)</small>
                  </div>
                </div>
              </div>
            `;
          }
        }).join('')}
      </div>
    </div>
  `;

  const view = document.getElementById('results-view');
  view.innerHTML = html;

  document.getElementById('btn-save-fav-result').addEventListener('click', () => saveFav(plan));
  document.getElementById('btn-download-route').addEventListener('click', () => downloadRoute(plan));
}

function downloadRoute(plan) {
  const content = `Delhi Transit Route Plan
========================

Origin: ${plan.origin}
Destination: ${plan.destination}

Journey Details
===============
Departure Time: ${plan.departure_time}
Arrival Time: ${plan.arrival_time}
Total Duration: ${plan.duration_minutes} minutes
Number of Transfers: ${plan.transfers}

Route:
------
${plan.legs.map((leg, i) => {
  if (leg.type === 'transit') {
    return `
${i + 1}. ${leg.mode.toUpperCase()} - ${leg.line_name} (Route ${leg.route})
   Board at: ${leg.board_stop} (${leg.board_time})
   Alight at: ${leg.alight_stop} (${leg.alight_time})
`;
  } else {
    return `
${i + 1}. WALK
   From: ${leg.from_stop}
   To: ${leg.to_stop}
   Duration: ${leg.walk_minutes} minutes
`;
  }
}).join('')}

Generated by Delhi Transit
https://delhi-route-recommender--sejalpandey30.replit.app
`;

  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Delhi-Transit-Route-${new Date().toISOString().split('T')[0]}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveFav(plan) {
  try {
    await fetch('/api/favourites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        origin_idx: selectedOrigin.stop_idx,
        dest_idx: selectedDest.stop_idx,
        label: `${plan.origin} → ${plan.destination}`
      })
    });
    showStatus('Route saved to favorites', 'success');
    loadFavouries();
  } catch (err) {
    showStatus('Failed to save route', 'error');
  }
}

document.getElementById('btn-plan').addEventListener('click', planRoute);
document.getElementById('time').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') planRoute();
});

/* ════════════════════════════════════════════════════════════════[...]
   4. HISTORY & FAVOURITES
   ════════════════════════════════════════════════════════════════[...]
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const history = await res.json();
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = '<div class="empty-state">No search history yet.</div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="list-row">
        <div class="list-row-info">
          <div class="list-row-route">${h.origin_name} → ${h.dest_name}</div>
          <div class="list-row-meta">${h.duration_min} min | ${h.transfers} transfer(s)</div>
        </div>
        <button class="btn-delete-row" data-id="${h.id}" title="Delete">×</button>
      </div>
    `).join('');
    list.querySelectorAll('.btn-delete-row').forEach(btn => {
      btn.addEventListener('click', async () => {
        await fetch(`/api/history/${btn.dataset.id}`, { method: 'DELETE' });
        loadHistory();
      });
    });
  } catch (err) {
    console.error(err);
  }
}

async function loadFavouries() {
  try {
    const res = await fetch('/api/favourites');
    const favs = await res.json();
    const list = document.getElementById('fav-list');
    if (!favs.length) {
      list.innerHTML = '<div class="empty-state">No favourite routes saved yet.</div>';
      return;
    }
    list.innerHTML = favs.map(f => `
      <div class="list-row">
        <div class="list-row-info">
          <div class="list-row-route">${f.origin_name} → ${f.dest_name}</div>
          <div class="list-row-meta">${f.label || 'Saved route'}</div>
        </div>
        <button class="btn-delete-row" data-id="${f.id}" title="Delete">×</button>
      </div>
    `).join('');
    list.querySelectorAll('.btn-delete-row').forEach(btn => {
      btn.addEventListener('click', async () => {
        await fetch(`/api/favourites/${btn.dataset.id}`, { method: 'DELETE' });
        loadFavouries();
      });
    });
  } catch (err) {
    console.error(err);
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`pane-${btn.dataset.tab}`).classList.add('active');
    if (btn.dataset.tab === 'history') loadHistory();
    if (btn.dataset.tab === 'favs') loadFavouries();
  });
});

document.getElementById('btn-clear-history').addEventListener('click', async () => {
  await fetch('/api/history/clear', { method: 'DELETE' });
  loadHistory();
});

loadHistory();
loadFavouries();
</script>
